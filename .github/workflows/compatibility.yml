name: macOS compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 and macOS 26 SDK
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Record environment
        run: |
          sw_vers
          uname -m
          swift --version
      - name: Tests
        run: swift test --scratch-path "$RUNNER_TEMP/wakemac-build"
      - name: Release bundle (ad hoc signature)
        env:
          WAKEMAC_BUILD_DIR: ${{ runner.temp }}/wakemac-release
          WAKEMAC_OUTPUT_DIR: ${{ runner.temp }}/wakemac-dist
        run: ./scripts/build-app.sh
